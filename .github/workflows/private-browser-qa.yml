name: Protected member browser QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  protected-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Test invitation, authenticated member pages, inventory admin UI
        run: npm run test:private:browser
      - name: Keep protected browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-browser-evidence
          path: |
            playwright-private-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
