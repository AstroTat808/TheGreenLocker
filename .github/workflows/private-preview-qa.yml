name: Private preview backend QA
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-catalog-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate backend and staging script syntax
        run: npm run check:backend
      - name: Validate server-side access controls and inventory
        run: npm run test:private
      - name: Validate isolated staging fail-closed configuration
        run: npm run test:staging
