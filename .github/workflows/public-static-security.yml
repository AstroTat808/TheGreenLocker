name: Public static site security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate security headers and public-site constraints
        run: node --test tests/public-static-security.test.mjs
